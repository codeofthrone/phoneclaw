name: appium-smoke-ci

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests-collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r appium-tests/requirements.txt

      - name: Python syntax check
        run: python -m py_compile appium-tests/conftest.py appium-tests/test_phoneclaw_smoke.py

      - name: Pytest collect-only (CI safe, no device required)
        run: python -m pytest --collect-only -q appium-tests
